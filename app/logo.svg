<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72">
  <defs>
    <!-- Teal gradient similar to your original -->
    <linearGradient id="pdflab-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3AA293"></stop>
      <stop offset="100%" stop-color="#37D6C1"></stop>
    </linearGradient>
  </defs>

  <!-- (Optional) dark background – remove this rect if you want transparency -->
  <rect x="0" y="0" width="260" height="72" rx="8" fill="#050608"></rect>

  <!-- Chart-style arrow icon -->
  <g transform="translate(24,18)">
    <path d="M0 32 L14 22 L26 26 L44 12" fill="none" stroke="url(#pdflab-teal)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
    <!-- Arrow head -->
    <path d="M38 12 L44 12 L44 18" fill="none" stroke="url(#pdflab-teal)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>

  <!-- Wordmark -->
  <text x="90" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" fill="#37D6C1">
    <tspan font-weight="600">PDF</tspan><tspan font-weight="400">Lab</tspan>
  </text>
</svg>
