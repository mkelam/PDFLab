  phase_2_core_improvements:
    effort: "1 week"
    items:
      - "Client-side format validation"
      - "Time estimates during processing"
      - "Monotonic progress algorithm"
      - "Success screen redesign with preview"
    expected_impact: "+25-30% conversion rate"

  phase_3_advanced_features:
    effort: "2-3 weeks"
    items:
      - "Auto-retry with graceful timeout handling"
      - "Multiple download/share options"
      - "Next-step suggestions & limit transparency"
      - "Full keyboard accessibility"
    expected_impact: "+35-40% conversion rate (cumulative)"
