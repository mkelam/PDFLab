# UX Wireflow Template - Actual vs Ideal
# Visual representation of user journeys before and after optimization

metadata:
  project: "[Project Name]"
  flow_name: "[e.g., Upload to Download Journey]"
  created_date: "[YYYY-MM-DD]"
  version: "1.0"

legend:
  symbols:
    decision_point: "◆"
    pain_point: "⚠️"
    dead_end: "⛔"
    improvement: "✨"
    removed_step: "❌"
    added_step: "➕"
    time_estimate: "⏱️"
    user_emotion: "😊😐😟"

# CURRENT FLOW (AS-IS)
current_flow:
  flow_name: "Current: PDF to PowerPoint Conversion"

  steps:
    - step: 1
      action: "Land on homepage"
      time: "⏱️ 0s"
      user_state: "Curious 😐"
      screen: |
        ┌─────────────────────────────────────┐
        │  [Logo]   Convert Files             │
        │                                      │
        │  Generic hero text here              │
        │                   [Small upload btn] │  ⚠️ Not prominent
        └─────────────────────────────────────┘
      pain_points:
        - "Value proposition unclear"
        - "CTA not prominent (8s scan time)"
        - "No trust signals visible"

    - step: 2
      action: "Search for upload button"
      time: "⏱️ 8s (excessive)"
      user_state: "Confused 😟"
      decision_point: "◆ Where is the upload?"
      pain_points:
        - "Visual hierarchy poor"
        - "Users attempt drag-drop (doesn't work)"

    - step: 3
      action: "Click upload button"
      time: "⏱️ 10s"
      user_state: "Tentative 😐"
      screen: |
        ┌─────────────────────────────────────┐
        │  Upload File                         │
        │                                      │
        │  [Browse button]                     │  ⚠️ No format guidance
        └─────────────────────────────────────┘

    - step: 4
      action: "Select file (wrong format - DOCX)"
      time: "⏱️ 15s"
      user_state: "Expecting success 😊"
      decision_point: "◆ Will this work?"

    - step: 5
      action: "Upload starts..."
      time: "⏱️ 20s"
      user_state: "Waiting 😐"

    - step: 6
      action: "ERROR: Invalid file format"
      time: "⏱️ 25s"
      user_state: "Frustrated 😟"
      screen: |
        ┌─────────────────────────────────────┐
        │  ❌ Error: Invalid file              │  ⚠️ Cryptic message
        │                                      │
        │  [Try again]                         │
        └─────────────────────────────────────┘
      pain_points:
        - "Validation too late (wasted 25s)"
        - "Error message unhelpful"
        - "No guidance on what went wrong"
      abandonment_rate: "15% abandon here"

    - step: 7
      action: "Re-upload with PDF (correct format)"
      time: "⏱️ 70s (45s recovery)"
      user_state: "Tentative 😐"

    - step: 8
      action: "Conversion processing..."
      time: "⏱️ 90s"
      user_state: "Anxious 😟"
      screen: |
        ┌─────────────────────────────────────┐
        │  Processing...                       │  ⚠️ No time estimate
        │                                      │
        │  [Generic spinner]                   │  ⚠️ Progress jumps backward
        └─────────────────────────────────────┘
      pain_points:
        - "No time estimate (feels infinite)"
        - "Progress bar unreliable"
        - "No visibility into what's happening"
      decision_point: "◆ Is it broken? Should I refresh?"
      abandonment_rate: "15% abandon here (timeout anxiety)"

    - step: 9
      action: "Timeout (5% of conversions)"
      time: "⏱️ 180s"
      user_state: "Angry 😡"
      screen: |
        ┌─────────────────────────────────────┐
        │  ❌ Request timed out                │  ⛔ Dead end
        │                                      │
        │  [Go back]                           │  ⚠️ No auto-retry
        └─────────────────────────────────────┘
      pain_points:
        - "No recovery mechanism"
        - "Work lost (must re-upload)"
      abandonment_rate: "80% abandon here"

    - step: 10
      action: "Conversion complete (successful path)"
      time: "⏱️ 180s"
      user_state: "Relieved but uncertain 😐"
      screen: |
        ┌─────────────────────────────────────┐
        │  Done                                │  ⚠️ Underwhelming
        │                                      │
        │  [Download]                          │  ⚠️ What's next?
        └─────────────────────────────────────┘
      pain_points:
        - "Success not celebratory"
        - "Unclear if it worked perfectly"
        - "No next steps suggested"

    - step: 11
      action: "Download file & leave"
      time: "⏱️ 185s"
      user_state: "Done 😐"
      abandonment_rate: "85% never return"

  total_time: "⏱️ 185s (3m 5s) for successful path"
  completion_rate: "78%"
  abandonment_points:
    - "25s: Format error (15%)"
    - "90s: Timeout anxiety (15%)"
    - "180s: Actual timeout (4% of those remaining)"
  overall_abandonment: "22% never complete"

# OPTIMIZED FLOW (TO-BE)
optimized_flow:
  flow_name: "Optimized: PDF to PowerPoint Conversion"

  steps:
    - step: 1
      action: "Land on homepage"
      time: "⏱️ 0s"
      user_state: "Curious 😐"
      screen: |
        ┌─────────────────────────────────────┐
        │  [Logo]  🔒 256-bit encryption       │  ✨ Trust signal
        │                                      │
        │  Convert PDFs to PowerPoint          │  ✨ Clear value prop
        │  in under 60 seconds                 │  ✨ Time expectation
        │                                      │
        │  ┌───────────────────────────────┐  │
        │  │  📄 Drop your PDF here or     │  │  ✨ Large, clear CTA
        │  │     click to browse           │  │  ✨ Drag-drop visible
        │  └───────────────────────────────┘  │
        │                                      │
        │  Trusted by 100,000+ users ⭐⭐⭐⭐⭐  │  ✨ Social proof
        └─────────────────────────────────────┘
      improvements:
        - "Value proposition specific & time-bound"
        - "Massive drag-drop zone (no searching)"
        - "Trust signals prominent"
        - "Accepted format clear (PDF)"

    - step: 2
      action: "Drag PDF file or click"
      time: "⏱️ 2s (-6s vs current)"
      user_state: "Confident 😊"
      improvements:
        - "No search time needed"
        - "Expected interaction works"

    - step: 3
      action: "File validates INSTANTLY (client-side)"
      time: "⏱️ 2.5s"
      user_state: "Assured 😊"
      screen: |
        ┌─────────────────────────────────────┐
        │  ✓ contract.pdf (2.3 MB) ready      │  ✨ Instant feedback
        │                                      │
        │  🔒 Encrypted & deleted after 24h    │  ✨ Privacy reassurance
        │                                      │
        │  [Convert to PowerPoint →]           │  ✨ Clear next action
        └─────────────────────────────────────┘
      improvements:
        - "Instant format validation"
        - "File size shown (sets expectations)"
        - "Privacy notice at moment of concern"
      alternative_path: |
        If wrong format:
        ┌─────────────────────────────────────┐
        │  This looks like a Word document.    │  ✨ Explain what's wrong
        │  We need a PDF file.                 │  ✨ State requirement
        │                                      │
        │  💡 Tip: Open in Word, Save As PDF   │  ✨ Helpful guidance
        │                                      │
        │  [Try again]                         │  ✨ Clear recovery
        └─────────────────────────────────────┘

    - step: 4
      action: "Click 'Convert to PowerPoint'"
      time: "⏱️ 3s"
      user_state: "Engaged 😊"

    - step: 5
      action: "Conversion processing with live updates"
      time: "⏱️ 5s - 45s"
      user_state: "Informed & calm 😊"
      screen: |
        ┌─────────────────────────────────────┐
        │  Converting your 12-page PDF         │  ✨ Specific to user's file
        │                                      │
        │  ████████░░░░░░░░░░░ 45%             │  ✨ Monotonic progress
        │                                      │
        │  About 20 seconds left ⏱️            │  ✨ Time estimate
        │                                      │
        │  Currently: Extracting images...     │  ✨ System visibility
        └─────────────────────────────────────┘
      improvements:
        - "Specific time estimate (not vague)"
        - "Progress never goes backward"
        - "Visible system status"
        - "File-specific details (12 pages)"

    - step: 6
      action: "Handle timeout gracefully (if occurs)"
      time: "⏱️ 60s (if needed)"
      user_state: "Still confident 😐"
      screen: |
        ┌─────────────────────────────────────┐
        │  Taking longer than expected...      │  ✨ Honest communication
        │                                      │
        │  We're still working on your file.   │  ✨ Reassurance
        │  This happens with complex PDFs.     │  ✨ Normalize issue
        │                                      │
        │  About 30 more seconds ⏱️            │  ✨ Updated estimate
        │                                      │
        │  (Auto-retrying in background)       │  ✨ Graceful recovery
        └─────────────────────────────────────┘
      improvements:
        - "Auto-retry (no user action needed)"
        - "Honest about delay"
        - "Updated estimates"
        - "No dead-end failures"
      abandonment_rate: "5% abandon here (-75% vs current)"

    - step: 7
      action: "Conversion complete!"
      time: "⏱️ 45s"
      user_state: "Delighted 😊"
      screen: |
        ┌─────────────────────────────────────┐
        │  ✨ Your PowerPoint is ready!        │  ✨ Celebratory
        │                                      │
        │  [Preview thumbnail shown]           │  ✨ Visual confirmation
        │                                      │
        │  ┌─────────────────┐                 │
        │  │  Download Now   │  Large button   │  ✨ Primary action clear
        │  └─────────────────┘                 │
        │                                      │
        │  Or: [Email to myself] [Share link]  │  ✨ Alternative actions
        │                                      │
        │  ──────────────────────────────────  │
        │                                      │
        │  Need another conversion?            │  ✨ Encourage re-use
        │  You have 1 of 3 free conversions    │  ✨ Transparent limits
        │  left this month.                    │
        └─────────────────────────────────────┘
      improvements:
        - "Success is celebratory & clear"
        - "Preview builds confidence"
        - "Multiple download options"
        - "Suggests next steps"
        - "Transparent about limits"

    - step: 8
      action: "Download & consider returning"
      time: "⏱️ 50s"
      user_state: "Satisfied & likely to return 😊"
      abandonment_rate: "50% return within 30 days (+40% vs current)"

  total_time: "⏱️ 50s (0m 50s) for successful path"
  time_savings: "-135s (-73% faster)"
  completion_rate: "92% (+14% vs current)"
  abandonment_reduction: "22% → 8% (-64% abandonment)"

# DELTA SUMMARY
improvements_summary:
  removed_steps:
    - "❌ 8s search time for upload button"
    - "❌ Format error after upload (moved to instant validation)"
    - "❌ 45s error recovery time"
    - "❌ Timeout dead-ends (now auto-retry)"

  added_steps:
    - "➕ Instant client-side format validation"
    - "➕ Drag-drop interaction (expected behavior)"
    - "➕ Live progress updates with time estimates"
    - "➕ Graceful timeout handling with auto-retry"
    - "➕ Preview thumbnail on success"
    - "➕ Multiple download/share options"
    - "➕ Next-step suggestions & limit transparency"

  improved_steps:
    - "✨ Landing: Clear value prop (60s promise) + trust signals"
    - "✨ Upload: Prominent CTA + dual affordance (click/drag)"
    - "✨ Processing: Monotonic progress + time estimates + system status"
    - "✨ Errors: Helpful, specific, actionable messages"
    - "✨ Success: Celebratory + visual confirmation + next steps"

  emotional_journey:
    current: "Curious 😐 → Confused 😟 → Frustrated 😟 → Anxious 😟 → Relieved 😐 → Done 😐"
    optimized: "Curious 😐 → Confident 😊 → Assured 😊 → Engaged 😊 → Informed 😊 → Delighted 😊"
    improvement: "Transformed negative emotions into positive experience"

