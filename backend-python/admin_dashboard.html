<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFLab Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .actions {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .actions h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #229954;
        }

        .users-table {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .users-table h2 {
            padding: 20px;
            border-bottom: 1px solid #eee;
            color: #333;
        }

        .filters {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filters select,
        .filters input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            font-weight: 600;
            color: #333;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            color: #555;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-verified {
            background: #d4edda;
            color: #155724;
        }

        .badge-unverified {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-free {
            background: #d1ecf1;
            color: #0c5460;
        }

        .badge-pro {
            background: #fff3cd;
            color: #856404;
        }

        .badge-enterprise {
            background: #d4edda;
            color: #155724;
        }

        .action-btns button {
            padding: 6px 12px;
            margin-right: 5px;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PDFLab Admin Dashboard</h1>
            <p>Manage users, plans, and system settings</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="number" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>Verified Users</h3>
                <div class="number" id="verifiedUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>Free Users</h3>
                <div class="number" id="freeUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>Paid Users</h3>
                <div class="number" id="paidUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Conversions</h3>
                <div class="number" id="totalConversions">-</div>
            </div>
        </div>

        <div class="actions">
            <h2>Quick Actions</h2>
            <button class="btn btn-success" onclick="showCreateUserModal()">+ Create New User</button>
            <button class="btn" onclick="loadUsers()">🔄 Refresh Users</button>
            <button class="btn" onclick="loadStats()">📊 Refresh Stats</button>
        </div>

        <div class="users-table">
            <h2>All Users</h2>
            <div class="filters">
                <select id="planFilter" onchange="loadUsers()">
                    <option value="">All Plans</option>
                    <option value="free">Free</option>
                    <option value="starter">Starter</option>
                    <option value="pro">Pro</option>
                    <option value="enterprise">Enterprise</option>
                </select>
                <select id="verifiedFilter" onchange="loadUsers()">
                    <option value="">All Users</option>
                    <option value="true">Verified Only</option>
                    <option value="false">Unverified Only</option>
                </select>
            </div>
            <div id="usersContainer">
                <div class="loading">Loading users...</div>
            </div>
        </div>
    </div>

    <!-- Create User Modal -->
    <div id="createUserModal" class="modal">
        <div class="modal-content">
            <h2>Create New User</h2>
            <div id="createError" class="error" style="display:none;"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="createEmail" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="createPassword" placeholder="Min 8 characters" required>
            </div>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="createName" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <label>Plan</label>
                <select id="createPlan">
                    <option value="free">Free</option>
                    <option value="starter">Starter</option>
                    <option value="pro">Pro</option>
                    <option value="enterprise">Enterprise</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="createVerified"> Email Verified
                </label>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="btn btn-success" onclick="createUser()">Create User</button>
                <button class="btn" onclick="hideCreateUserModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <h2>Edit User</h2>
            <div id="editError" class="error" style="display:none;"></div>
            <input type="hidden" id="editUserId">
            <div class="form-group">
                <label>Email (read-only)</label>
                <input type="email" id="editEmail" readonly>
            </div>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>Plan</label>
                <select id="editPlan">
                    <option value="free">Free</option>
                    <option value="starter">Starter</option>
                    <option value="pro">Pro</option>
                    <option value="enterprise">Enterprise</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="editVerified"> Email Verified
                </label>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="btn btn-success" onclick="updateUser()">Save Changes</button>
                <button class="btn" onclick="hideEditUserModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3007';

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/api/admin/stats`);
                const data = await response.json();

                document.getElementById('totalUsers').textContent = data.total_users;
                document.getElementById('verifiedUsers').textContent = data.verified_users;
                document.getElementById('freeUsers').textContent = data.free_users;
                document.getElementById('paidUsers').textContent = data.paid_users;
                document.getElementById('totalConversions').textContent = data.total_conversions;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load users
        async function loadUsers() {
            const planFilter = document.getElementById('planFilter').value;
            const verifiedFilter = document.getElementById('verifiedFilter').value;

            let url = `${API_URL}/api/admin/users?limit=100`;
            if (planFilter) url += `&plan=${planFilter}`;
            if (verifiedFilter) url += `&verified=${verifiedFilter}`;

            try {
                const response = await fetch(url);
                const users = await response.json();

                displayUsers(users);
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('usersContainer').innerHTML = '<div class="error">Failed to load users</div>';
            }
        }

        // Display users table
        function displayUsers(users) {
            if (users.length === 0) {
                document.getElementById('usersContainer').innerHTML = '<div class="loading">No users found</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Name</th>
                            <th>Plan</th>
                            <th>Verified</th>
                            <th>Conversions</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            users.forEach(user => {
                const verified = user.email_verified
                    ? '<span class="badge badge-verified">✓ Verified</span>'
                    : '<span class="badge badge-unverified">✗ Unverified</span>';

                const planBadge = `<span class="badge badge-${user.plan}">${user.plan.toUpperCase()}</span>`;

                const createdDate = new Date(user.created_at).toLocaleDateString();

                html += `
                    <tr>
                        <td>${user.email}</td>
                        <td>${user.name || '-'}</td>
                        <td>${planBadge}</td>
                        <td>${verified}</td>
                        <td>${user.conversions_used}/${user.conversions_limit}</td>
                        <td>${createdDate}</td>
                        <td class="action-btns">
                            <button class="btn" onclick="editUser('${user.id}')">Edit</button>
                            <button class="btn btn-success" onclick="resetQuota('${user.id}')">Reset Quota</button>
                            <button class="btn btn-danger" onclick="deleteUser('${user.id}', '${user.email}')">Delete</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('usersContainer').innerHTML = html;
        }

        // Create user
        function showCreateUserModal() {
            document.getElementById('createUserModal').classList.add('active');
        }

        function hideCreateUserModal() {
            document.getElementById('createUserModal').classList.remove('active');
            document.getElementById('createEmail').value = '';
            document.getElementById('createPassword').value = '';
            document.getElementById('createName').value = '';
            document.getElementById('createPlan').value = 'free';
            document.getElementById('createVerified').checked = false;
            document.getElementById('createError').style.display = 'none';
        }

        async function createUser() {
            const email = document.getElementById('createEmail').value;
            const password = document.getElementById('createPassword').value;
            const name = document.getElementById('createName').value;
            const plan = document.getElementById('createPlan').value;
            const email_verified = document.getElementById('createVerified').checked;

            if (!email || !password || !name) {
                alert('Please fill in all required fields');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/admin/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, name, plan, email_verified })
                });

                if (response.ok) {
                    hideCreateUserModal();
                    loadUsers();
                    loadStats();
                    alert('User created successfully!');
                } else {
                    const error = await response.json();
                    document.getElementById('createError').textContent = error.detail;
                    document.getElementById('createError').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('createError').textContent = 'Failed to create user';
                document.getElementById('createError').style.display = 'block';
            }
        }

        // Edit user
        async function editUser(userId) {
            try {
                const response = await fetch(`${API_URL}/api/admin/users/${userId}`);
                const user = await response.json();

                document.getElementById('editUserId').value = user.id;
                document.getElementById('editEmail').value = user.email;
                document.getElementById('editName').value = user.name || '';
                document.getElementById('editPlan').value = user.plan;
                document.getElementById('editVerified').checked = user.email_verified;

                document.getElementById('editUserModal').classList.add('active');
            } catch (error) {
                alert('Failed to load user details');
            }
        }

        function hideEditUserModal() {
            document.getElementById('editUserModal').classList.remove('active');
            document.getElementById('editError').style.display = 'none';
        }

        async function updateUser() {
            const userId = document.getElementById('editUserId').value;
            const name = document.getElementById('editName').value;
            const plan = document.getElementById('editPlan').value;
            const email_verified = document.getElementById('editVerified').checked;

            try {
                const response = await fetch(`${API_URL}/api/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, plan, email_verified })
                });

                if (response.ok) {
                    hideEditUserModal();
                    loadUsers();
                    loadStats();
                    alert('User updated successfully!');
                } else {
                    const error = await response.json();
                    document.getElementById('editError').textContent = error.detail;
                    document.getElementById('editError').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('editError').textContent = 'Failed to update user';
                document.getElementById('editError').style.display = 'block';
            }
        }

        // Delete user
        async function deleteUser(userId, email) {
            if (!confirm(`Are you sure you want to delete user: ${email}?\n\nThis action cannot be undone!`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/admin/users/${userId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadUsers();
                    loadStats();
                    alert('User deleted successfully!');
                } else {
                    alert('Failed to delete user');
                }
            } catch (error) {
                alert('Failed to delete user');
            }
        }

        // Reset quota
        async function resetQuota(userId) {
            if (!confirm('Reset this user\'s monthly conversion quota to 0?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/admin/users/${userId}/reset-quota`, {
                    method: 'POST'
                });

                if (response.ok) {
                    loadUsers();
                    alert('Quota reset successfully!');
                } else {
                    alert('Failed to reset quota');
                }
            } catch (error) {
                alert('Failed to reset quota');
            }
        }

        // Load data on page load
        loadStats();
        loadUsers();

        // Refresh every 30 seconds
        setInterval(() => {
            loadStats();
            loadUsers();
        }, 30000);
    </script>
</body>
</html>
