[project]
name = "pdflab-api"
version = "0.1.0"
description = ""
authors = [
    {name = "mkelam",email = "mmkela@gmail.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.120.2,<0.121.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "sqlalchemy[asyncio] (>=2.0.44,<3.0.0)",
    "aiomysql (>=0.3.2,<0.4.0)",
    "alembic (>=1.17.1,<2.0.0)",
    "celery (>=5.5.3,<6.0.0)",
    "redis (>=7.0.1,<8.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "pendulum (>=3.1.0,<4.0.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "python-json-logger (>=4.0.0,<5.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "bcrypt (>=4.1.0,<5.0.0)",
    "aiosmtplib (>=3.0.0,<4.0.0)",
    "jinja2 (>=3.1.0,<4.0.0)",
    "tabulate (>=0.9.0,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "faker (>=37.12.0,<38.0.0)",
    "locust (>=2.42.1,<3.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "ruff (>=0.14.2,<0.15.0)",
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]
