current_priorities:
  immediate:
    - VPS deployment verification and monitoring
    - Production environment stability
    - Payment flow testing and validation
    - Performance optimization for Docker containers

  short_term:
    - Admin panel enhancements
    - User analytics dashboard
    - Batch conversion feature
    - API rate limiting improvements

  long_term:
    - Enterprise API access implementation
    - Advanced OCR features for Pro+ plans
    - Webhook support for API users
    - Multi-region deployment strategy

technical_standards:
  code_quality:
    - TypeScript strict mode enabled
    - ESLint + Prettier configuration
    - Minimum 80% test coverage
    - Code review required for all PRs

  security:
    - JWT authentication with refresh tokens
    - Bcrypt password hashing (salt rounds: 10)
    - Rate limiting on all endpoints
    - PayFast ITN triple validation

  performance:
    - Response time < 200ms for API endpoints
    - File upload size validation by user plan
    - Redis caching for job status
    - Bull queue for async processing

  deployment:
    - Docker containerization
    - Environment-based configuration
    - Automated health checks
    - Zero-downtime deployments

decision_framework:
  architecture:
    - Prioritize maintainability over complexity
    - Use boring technology where possible
    - Design for horizontal scalability
    - Implement progressive enhancement

  development:
    - Test-driven development for critical features
    - Feature flags for gradual rollouts
    - Comprehensive logging and monitoring
    - Documentation-first API design

  operations:
    - Infrastructure as code
    - Automated CI/CD pipelines
    - Regular security audits
    - Performance monitoring and alerting

communication_protocols:
  daily_sync:
    time: "09:00 UTC"
    format: "Stand-up format (Yesterday/Today/Blockers)"

  weekly_review:
    time: "Friday 14:00 UTC"
    agenda:
      - Sprint progress review
      - Technical debt assessment
      - Architecture decisions
      - Risk identification

  emergency_response:
    severity_levels:
      P0: "Production down - All hands"
      P1: "Critical bug - Senior panel assembles"
      P2: "Major issue - Architect + Dev lead"
      P3: "Minor issue - Standard workflow"

activation_commands:
  assemble_panel: |
    # To activate the full senior technical panel:
    1. Load this configuration: senior-technical-panel.yaml
    2. Initialize each agent with their specific roles
    3. Execute: *panel-sync for status update
    4. Begin with: *panel-priority-review

  individual_agents:
    architect: "Load BMAD-METHOD/bmad-core/agents/architect.md"
    orchestrator: "Load BMAD-METHOD/bmad-core/agents/bmad-orchestrator.md"
    developer: "Load BMAD-METHOD/bmad-core/agents/dev.md"
    qa_lead: "Load BMAD-METHOD/bmad-core/agents/qa.md"
    project_manager: "Load BMAD-METHOD/bmad-core/agents/pm.md"

panel_commands:
  - "*panel-sync": Synchronize all panel members on current status
  - "*panel-review {topic}": Conduct focused review on specific topic
  - "*panel-decision {issue}": Make architectural/technical decision
  - "*panel-sprint-plan": Plan next sprint with full panel input
  - "*panel-retro": Conduct retrospective with improvements
  - "*panel-emergency {issue}": Activate emergency response protocol

notes:
  - This panel configuration is optimized for the PDFLab project
  - Panel members can be activated individually or as a group
  - Use bmad-orchestrator for complex multi-agent workflows
  - All decisions should be documented in DECISION_LOG.md