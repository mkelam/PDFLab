version: '3.8'

services:
  # MySQL Database for Staging
  mysql-staging:
    image: mysql:8.0
    container_name: pdflab-mysql-staging
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: StagingRoot2024!SecurePass
      MYSQL_DATABASE: pdflab_staging
      MYSQL_USER: pdflab_staging
      MYSQL_PASSWORD: StagingDB2024!UserPass
    volumes:
      - mysql-staging-data:/var/lib/mysql
    networks:
      - pdflab-staging-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pStagingRoot2024!SecurePass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis Cache for Staging
  redis-staging:
    image: redis:7-alpine
    container_name: pdflab-redis-staging
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-staging-data:/data
    networks:
      - pdflab-staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API for Staging (UPDATED TO :latest)
  backend-staging:
    image: mkelam/pdflab-backend:latest
    container_name: pdflab-backend-staging
    restart: unless-stopped
    ports:
      - "3007:3006"
    environment:
      NODE_ENV: staging
      PORT: 3006
      DB_HOST: mysql-staging
      DB_PORT: 3306
      DB_USER: pdflab_staging
      DB_PASSWORD: StagingDB2024!UserPass
