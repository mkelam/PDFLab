    networks:
      - pdflab-staging-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Partner Portal for Staging (UPDATED TO :latest)
  partners-staging:
    image: mkelam/pdflab-partners:latest
    container_name: pdflab-partners-staging
    restart: unless-stopped
    ports:
      - "3003:3001"
    environment:
      NODE_ENV: staging
      PORT: 3001
      NEXT_PUBLIC_API_URL: https://staging.pdflab.pro/api
    depends_on:
      backend-staging:
        condition: service_healthy
    networks:
      - pdflab-staging-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql-staging-data:
    driver: local
  redis-staging-data:
    driver: local
  backend-staging-storage:
    driver: local

networks:
  pdflab-staging-network:
    driver: bridge
