version: '3.8'

services:
  # MySQL Database for Staging
  mysql-staging:
    image: mysql:8.0
    container_name: pdflab-mysql-staging
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${STAGING_MYSQL_ROOT_PASSWORD:?set STAGING_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pdflab_staging
      MYSQL_USER: pdflab_staging
      MYSQL_PASSWORD: ${STAGING_MYSQL_PASSWORD:?set STAGING_MYSQL_PASSWORD}
    volumes:
      - mysql-staging-data:/var/lib/mysql
    networks:
      - pdflab-staging-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${STAGING_MYSQL_ROOT_PASSWORD:?set STAGING_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis Cache for Staging
  redis-staging:
    image: redis:7-alpine
    container_name: pdflab-redis-staging
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-staging-data:/data
    networks:
      - pdflab-staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API for Staging (UPDATED TO :latest)
  backend-staging:
    image: mkelam/pdflab-backend:latest
    container_name: pdflab-backend-staging
    restart: unless-stopped
    ports:
      - "3007:3006"
    environment:
      NODE_ENV: staging
      PORT: 3006
      DB_HOST: mysql-staging
      DB_PORT: 3306
      DB_USER: pdflab_staging
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?set STAGING_DB_PASSWORD}
      DB_NAME: pdflab_staging
      DB_SYNC: "false"
      DB_ALTER: "false"
      REDIS_HOST: redis-staging
      REDIS_PORT: 6379
      JWT_SECRET: ${STAGING_JWT_SECRET:?set STAGING_JWT_SECRET}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 30d
      CLOUDCONVERT_API_KEY: ${CLOUDCONVERT_API_KEY:?set CLOUDCONVERT_API_KEY}
      CLOUDCONVERT_SANDBOX: "false"
      PAYFAST_MERCHANT_ID: 10000100
      PAYFAST_MERCHANT_KEY: 46f0cd694581a
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE:-}
      PAYFAST_MODE: sandbox
      CORS_ORIGIN: https://staging.pdflab.pro,http://staging.pdflab.pro,http://141.136.44.168:3002,http://141.136.44.168:3003,http://141.136.44.168:3007
      STORAGE_PATH: /app/storage
      SMTP_HOST: smtp.hostinger.com
      SMTP_PORT: 465
      SMTP_SECURE: "true"
      SMTP_USER: support@pdflab.pro
      SMTP_PASSWORD: ""
      EMAIL_FROM: support@pdflab.pro
    volumes:
      - backend-staging-storage:/app/storage
    depends_on:
      mysql-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    networks:
      - pdflab-staging-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Worker Service for Staging (NEW - CRITICAL GAP FIX)
  worker-staging:
    image: mkelam/pdflab-backend:latest
    container_name: pdflab-worker-staging
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      WORKER_MODE: "true"
      DB_HOST: mysql-staging
      DB_PORT: 3306
      DB_USER: pdflab_staging
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?set STAGING_DB_PASSWORD}
      DB_NAME: pdflab_staging
      DB_SYNC: "false"
      DB_ALTER: "false"
      REDIS_HOST: redis-staging
      REDIS_PORT: 6379
      JWT_SECRET: ${STAGING_JWT_SECRET:?set STAGING_JWT_SECRET}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 30d
      CLOUDCONVERT_API_KEY: ${CLOUDCONVERT_API_KEY:?set CLOUDCONVERT_API_KEY}
      CLOUDCONVERT_SANDBOX: "false"
      STORAGE_PATH: /app/storage
      SMTP_HOST: smtp.hostinger.com
      SMTP_PORT: 465
      SMTP_SECURE: "true"
      SMTP_USER: support@pdflab.pro
      SMTP_PASSWORD: ""
      EMAIL_FROM: support@pdflab.pro
    volumes:
      - backend-staging-storage:/app/storage
    depends_on:
      mysql-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    networks:
      - pdflab-staging-network

  # Frontend for Staging (UPDATED TO :latest)
  frontend-staging:
    image: mkelam/pdflab-frontend:latest
    container_name: pdflab-frontend-staging
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: https://staging.pdflab.pro/api
    depends_on:
      backend-staging:
        condition: service_healthy
    networks:
      - pdflab-staging-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Partner Portal for Staging (UPDATED TO :latest)
  partners-staging:
    image: mkelam/pdflab-partners:latest
    container_name: pdflab-partners-staging
    restart: unless-stopped
    ports:
      - "3003:3001"
    environment:
      NODE_ENV: staging
      PORT: 3001
      NEXT_PUBLIC_API_URL: https://staging.pdflab.pro/api
    depends_on:
      backend-staging:
        condition: service_healthy
    networks:
      - pdflab-staging-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql-staging-data:
    driver: local
  redis-staging-data:
    driver: local
  backend-staging-storage:
    driver: local

networks:
  pdflab-staging-network:
    driver: bridge
