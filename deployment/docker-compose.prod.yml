# PDFLab Production Environment Overrides
# Deploy with: docker-compose -f docker-compose.base.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  mysql:
    container_name: pdflab-mysql-prod
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: pdflab_production
      MYSQL_USER: pdflab
      MYSQL_PASSWORD: ***REMOVED***

  redis:
    container_name: pdflab-redis-prod
    ports:
      - "6379:6379"

  backend:
    container_name: pdflab-backend-prod
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: production
      PORT: 3006
      DB_NAME: pdflab_production
      DB_USER: pdflab
      DB_PASSWORD: ***REMOVED***
      ENV_FILE_PATH: ./backend/.env.production

  worker:
    container_name: pdflab-worker-prod
    environment:
      NODE_ENV: production
      DB_NAME: pdflab_production
      DB_USER: pdflab
      DB_PASSWORD: ***REMOVED***
      ENV_FILE_PATH: ./backend/.env.production

  frontend:
    container_name: pdflab-frontend-prod
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://pdflab.pro
      NEXT_PUBLIC_APP_URL: https://pdflab.pro
      NEXT_PUBLIC_CURRENCY: USD
      NEXT_PUBLIC_CURRENCY_SYMBOL: $$
