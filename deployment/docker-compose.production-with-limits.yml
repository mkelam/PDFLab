version: '3.8'

services:
  backend:
    image: mkelam/pdflab-backend:latest
    container_name: pdflab-backend-prod
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - REDIS_HOST=redis
    env_file:
      - ./backend/.env.production
    depends_on:
      - mysql
      - redis
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
    networks:
      - pdflab-network
    volumes:
      - pdflab-storage:/app/storage
      - pdflab-logs:/app/logs

  # Background Job Worker (Bull Queue Processor)
  worker:
    image: mkelam/pdflab-backend:latest
    container_name: pdflab-worker-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - WORKER_MODE=true
    env_file:
      - ./backend/.env.production
    depends_on:
      - mysql
      - redis
      - backend
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
    networks:
      - pdflab-network
    volumes:
      - pdflab-storage:/app/storage
      - pdflab-logs:/app/logs
    command: ["node", "dist/server.js"]

  frontend:
    image: mkelam/pdflab-frontend:latest
    container_name: pdflab-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://pdflab.pro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      - pdflab-network
    depends_on:
      - backend

  # Partner Portal (Influencer/Affiliate Dashboard)
  partners:
    image: mkelam/pdflab-partners:latest
    container_name: pdflab-partners-prod
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://pdflab.pro
      - PORT=3001
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      - pdflab-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8.0
    container_name: pdflab-mysql-prod
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=pdflab_production
      - MYSQL_USER=pdflab
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    # Port removed for security - only accessible via Docker network
    expose:
      - "3306"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pdflab-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: pdflab-redis-prod
    restart: unless-stopped
    # Port removed for security - only accessible via Docker network
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - pdflab-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  pdflab-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/pdflab/storage
  pdflab-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/pdflab/logs
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  pdflab-network:
    driver: bridge
