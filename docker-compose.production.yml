version: '3.8'

services:
  backend:
    image: mkelam/pdflab-backend:latest
    container_name: pdflab-backend-prod
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - REDIS_HOST=redis
    env_file:
      - ./backend/.env.production
    depends_on:
      - mysql
      - redis
    networks:
      - pdflab-network
    volumes:
      - pdflab-storage:/app/storage
      - pdflab-logs:/app/logs

  frontend:
    image: mkelam/pdflab-frontend:latest
    container_name: pdflab-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://141.136.44.168:3006
    networks:
      - pdflab-network
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: pdflab-mysql-prod
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=pdflab_production
      - MYSQL_USER=pdflab
      - MYSQL_PASSWORD=***REMOVED***
      - MYSQL_ROOT_PASSWORD=***REMOVED***
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pdflab-network

  redis:
    image: redis:7-alpine
    container_name: pdflab-redis-prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - pdflab-network

volumes:
  pdflab-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/pdflab/storage
  pdflab-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/pdflab/logs
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  pdflab-network:
    driver: bridge
