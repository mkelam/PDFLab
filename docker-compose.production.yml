# PDFLab Production Docker Compose Configuration
# This configuration pulls images from Docker Hub for VPS deployment
# Usage: docker-compose -f docker-compose.production.yml up -d

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: pdflab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-pdflab}
      MYSQL_USER: ${DB_USER:-pdflab}
      MYSQL_PASSWORD: ${DB_PASSWORD:-***REMOVED***}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pdflab-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: pdflab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - pdflab-network

  # Backend API (pulled from Docker Hub)
  backend:
    image: mkelam/pdflab-backend:production
    container_name: pdflab-backend
    restart: unless-stopped  # Auto-restart on failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Server
      NODE_ENV: production
      PORT: 3006

      # Database (use service names for container networking)
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-pdflab}
      DB_PASSWORD: ${DB_PASSWORD:-***REMOVED***}
      DB_NAME: ${DB_NAME:-pdflab}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # CloudConvert
      CLOUDCONVERT_API_KEY: ${CLOUDCONVERT_API_KEY}
      CLOUDCONVERT_SANDBOX: ${CLOUDCONVERT_SANDBOX:-false}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-30d}

      # PayFast
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE}
      PAYFAST_MODE: ${PAYFAST_MODE:-production}

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3006:3006"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - pdflab-network
    # Resource limits to prevent runaway processes
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    # Auto-restart policy configuration
    # unless-stopped: Restart on failure unless manually stopped
    # on-failure: Only restart on error exit
    # always: Always restart (even after manual stop)

  # Background Worker (pulled from Docker Hub)
  worker:
    image: mkelam/pdflab-worker:production
    container_name: pdflab-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production

      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-pdflab}
      DB_PASSWORD: ${DB_PASSWORD:-***REMOVED***}
      DB_NAME: ${DB_NAME:-pdflab}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # CloudConvert
      CLOUDCONVERT_API_KEY: ${CLOUDCONVERT_API_KEY}
      CLOUDCONVERT_SANDBOX: ${CLOUDCONVERT_SANDBOX:-false}

      # Storage
      STORAGE_PATH: /app/storage
    volumes:
      - backend_storage:/app/storage
    networks:
      - pdflab-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Frontend (pulled from Docker Hub)
  frontend:
    image: mkelam/pdflab-frontend:production
    container_name: pdflab-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3006}
    ports:
      - "3000:3000"
    networks:
      - pdflab-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local

networks:
  pdflab-network:
    driver: bridge
