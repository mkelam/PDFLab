name: Backend CI/CD

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'backend/**'

jobs:
  quality-checks:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript compilation check
        working-directory: backend
        run: npm run typecheck

      - name: ESLint check
        working-directory: backend
        run: npm run lint:check

      - name: Prettier check
        working-directory: backend
        run: npm run format:check

      - name: Run tests
        working-directory: backend
        run: npm run test:coverage

      - name: Check type health
        working-directory: backend
        run: npm run type-health

      - name: Build production bundle
        working-directory: backend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build -t pdflab-backend:test .

      - name: Test Docker image
        run: |
          docker run --rm pdflab-backend:test node --version

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        working-directory: backend
        run: npm audit --audit-level=moderate

      - name: Check for type safety regressions
        working-directory: backend
        run: |
          # This will fail if there are any @ts-ignore or @ts-expect-error comments
          ! grep -r "@ts-ignore\|@ts-expect-error" src/ || exit 1
