name: Frontend CI/CD

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'contexts/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [master, main, develop]

jobs:
  quality-checks:
    name: Next.js Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Next.js lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          INTERNAL_API_URL: http://localhost:3006
